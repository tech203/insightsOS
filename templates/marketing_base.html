<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DarInsights{% endblock %}</title>
    <script>
        // Restore theme before first paint to avoid a flash. Mirrors
        // the same logic in base.html so the marketing pages and the
        // app share a single theme preference.
        try {
            var __t = localStorage.getItem("darInsightsTheme");
            if (!__t) {
                __t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
            }
            document.documentElement.setAttribute("data-theme", __t);
        } catch (_) {}
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles-v2.1.css') }}?v={{ static_css_version }}">
    {% block head_extra %}{% endblock %}
</head>
<body class="marketing-body">

    {% block content %}{% endblock %}
    {% block scripts %}{% endblock %}

</body>
</html>
