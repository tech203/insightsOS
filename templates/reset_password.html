{% extends "base.html" %}
{% block title %}Set a new password — DarInsights{% endblock %}

{% block content %}
<div class="surface-card" style="max-width: 420px; margin: 4rem auto; padding: 2rem 1.5rem;">
    <h1 style="margin: 0 0 0.4rem 0; font-size: 1.5rem; color: var(--text-strong);">Set a new password</h1>
    <p style="color: var(--text-muted); margin: 0 0 1.25rem 0;">
        Pick something at least 8 characters long. The reset link expires after this submission.
    </p>

    <form method="post" action="{{ url_for('reset_password', token=token) }}" class="settings-v3-form" autocomplete="off">
        <label for="rp-new">New password</label>
        <input id="rp-new" type="password" name="new_password" required minlength="8" autocomplete="new-password">

        <label for="rp-confirm">Confirm new password</label>
        <input id="rp-confirm" type="password" name="confirm_password" required minlength="8" autocomplete="new-password">

        <button type="submit" class="btn btn-primary" style="margin-top: 0.65rem;">Update password</button>
    </form>
</div>
{% endblock %}
