<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_json.seo.title if page_json.seo else page.title }}</title>
    <meta name="description" content="{{ page_json.seo.description if page_json.seo else '' }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles-v2.1.css') }}">
    {% for schema_item in page_json.schema_json or [] %}
    <script type="application/ld+json">{{ schema_item|tojson }}</script>
    {% endfor %}
</head>

<body class="generated-site-body theme-{{ project.theme }}">
    <nav class="generated-site-nav">
        <a href="{{ url_for('public_website_project', project_id=project.id) }}" class="generated-site-brand">
            {{ blueprint.client_name }}
        </a>

        <div class="generated-site-nav-links">
            {% for nav_page in pages %}
                <a href="{{ url_for('public_website_page', project_id=project.id, slug=nav_page.slug) if nav_page.slug != 'home' else url_for('public_website_project', project_id=project.id) }}">
                    {{ nav_page.page_type|replace("_", " ")|title }}
                </a>
            {% endfor %}
        </div>
    </nav>

    <main class="generated-site">
        {% include "website_engine_render.html" %}
    </main>
</body>
</html>
