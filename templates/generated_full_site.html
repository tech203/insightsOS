<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ page_json.seo.title if page_json.seo else page.title }}</title>
    <meta name="description" content="{{ page_json.seo.description if page_json.seo else '' }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="{{ url_for('static', filename='styles-v2.1.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='generated-site.css') }}">
    {% for schema_item in page_json.schema_json or [] %}
    <script type="application/ld+json">{{ schema_item|tojson }}</script>
    {% endfor %}
</head>

<body
    class="generated-site-body theme-{{ project.theme }} style-{{ blueprint.visual_style or 'modern_ecommerce' }}"
    style="
        --site-primary: {{ blueprint.primary_color or '#f97316' }};
        {# Derive a darker variant via color-mix so hover states and the
           hero gradient don't go flat when the user picks a real brand
           colour. Both --site-primary and --site-primary-dark used to
           read blueprint.primary_color, leaving them identical. #}
        --site-primary-dark: color-mix(in srgb, {{ blueprint.primary_color or '#f97316' }}, black 18%);
        --site-primary-soft: {{ blueprint.secondary_color or '#fff7ed' }};
        --site-accent-soft: {{ blueprint.accent_color or '#ffedd5' }};
        --site-text: {{ blueprint.text_color or '#0f172a' }};
    "
>
    <nav class="generated-site-nav">
        <a href="{{ url_for('public_website_project', project_id=project.id) }}" class="generated-site-brand">
            {% if blueprint.logo_url %}
            <img
                src="{{ blueprint.logo_url }}"
                alt="{{ blueprint.client_name }}"
                style="height:32px;width:auto;display:block;"
            >
            {% else %}
            {{ blueprint.client_name }}
            {% endif %}
        </a>

        <div class="generated-site-nav-links">
            {% for nav_page in pages %}
                <a href="{{ url_for('public_website_page', project_id=project.id, slug=nav_page.slug) if nav_page.slug != 'home' else url_for('public_website_project', project_id=project.id) }}">
                    {{ nav_page.page_type|replace("_", " ")|title }}
                </a>
            {% endfor %}
        </div>
    </nav>

    <main class="generated-site">
        {% include "website_engine_render.html" %}
    </main>
</body>
</html>
