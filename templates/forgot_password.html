{% extends "base.html" %}
{% block title %}Reset password — DarInsights{% endblock %}

{% block content %}
<div class="surface-card" style="max-width: 420px; margin: 4rem auto; padding: 2rem 1.5rem;">
    <h1 style="margin: 0 0 0.4rem 0; font-size: 1.5rem; color: var(--text-strong);">Reset your password</h1>
    <p style="color: var(--text-muted); margin: 0 0 1.25rem 0;">
        Enter the email on your account. We'll send you a link to set a new password.
    </p>

    <form method="post" action="{{ url_for('forgot_password') }}" class="settings-v3-form">
        <label for="fp-email">Email</label>
        <input id="fp-email" type="email" name="email" required autocomplete="email">
        <button type="submit" class="btn btn-primary" style="margin-top: 0.65rem;">Send reset link</button>
    </form>

    <p style="font-size: 0.85rem; color: var(--text-muted); margin-top: 1.25rem;">
        Remembered it? <a href="{{ url_for('login') }}">Back to sign in</a>.
    </p>
</div>
{% endblock %}
