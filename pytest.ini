[pytest]
# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Pre-existing datetime.utcnow() usage in app.py + tests issues a
# deprecation warning per call. They're real but out of scope for the
# tests we're adding — a follow-up should migrate the codebase to
# timezone-aware datetimes. Silenced here so the test output stays
# readable.
filterwarnings =
    ignore::DeprecationWarning:app
    ignore::DeprecationWarning:tests.*

# Show short tracebacks by default so failures are easy to scan.
addopts = --tb=short
